<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PremierLift CRM — Мастер</title>
  <link rel="manifest" href="/static/manifest.mobile.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .mobile-action-grid button:disabled{
      cursor:not-allowed;
      opacity:.45;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <main class="max-w-3xl mx-auto px-4 py-4 space-y-4">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h1 class="text-xl font-semibold">Приложение мастера</h1>
        <p class="text-sm text-slate-600">Оффлайн-очередь для заявок; начало работы подтверждается геозоной 500 м.</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <a href="/admin?ui=admin" class="px-3 py-2 rounded-xl bg-slate-100 ring-1 ring-slate-200 text-sm">
          Перейти в админку
        </a>
        <span id="sync-status" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-200 text-slate-700">—</span>
        <button id="btn-sync" class="px-3 py-2 rounded-xl bg-slate-900 text-white text-sm">Синхронизировать</button>
        <button id="btn-reset" class="px-3 py-2 rounded-xl bg-slate-100 ring-1 ring-slate-200 text-sm">Сброс офлайн-данных</button>
      </div>
    </header>

    <section class="bg-white rounded-2xl shadow p-4 space-y-3">
      <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-center gap-2">
          <button id="tab-tickets" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-900 text-white">Мои заявки</button>
          <button id="tab-history" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-200 text-slate-700">История</button>
        </div>
        <span id="last-sync" class="text-xs text-slate-500">—</span>
      </div>
      <div id="tickets-panel" class="space-y-2">
        <div id="tickets-list" class="space-y-2"></div>
      </div>
      <div id="outbox-panel" class="hidden rounded-xl border border-amber-200 bg-amber-50 p-3 space-y-2">
        <div class="flex items-center justify-between gap-2">
          <div class="text-sm font-semibold text-amber-900">Требует внимания</div>
          <button id="outbox-retry-all" class="px-3 py-1 rounded-lg bg-amber-900 text-white text-xs font-semibold">
            Повторить
          </button>
        </div>
        <div id="outbox-failed-list" class="space-y-2"></div>
      </div>
      <div id="history-panel" class="space-y-3 hidden">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <div>
            <label class="text-xs text-slate-500">Дата с</label>
            <input id="history-date-from" type="date" class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-1 text-sm" />
          </div>
          <div>
            <label class="text-xs text-slate-500">Дата по</label>
            <input id="history-date-to" type="date" class="mt-1 w-full rounded-lg border border-slate-200 px-2 py-1 text-sm" />
          </div>
          <div class="flex items-end">
            <button id="history-apply" class="w-full px-3 py-2 rounded-xl bg-slate-900 text-white text-sm">Применить</button>
          </div>
        </div>
        <div class="flex items-center justify-between text-xs">
          <span id="history-offline" class="text-amber-600 hidden">Оффлайн данные</span>
          <span id="history-updated" class="text-slate-500">—</span>
        </div>
        <div id="history-list" class="space-y-2"></div>
      </div>
    </section>

    <section id="ticket-detail-card" class="bg-white rounded-2xl shadow p-4 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold">Детали заявки</h2>
        <span id="ticket-status" class="text-xs text-slate-500">—</span>
      </div>
      <div id="ticket-detail" class="text-sm text-slate-700">Выберите заявку в списке.</div>
    </section>

    <section id="history-detail-card" class="bg-white rounded-2xl shadow p-4 space-y-3 hidden">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold">История заявки</h2>
        <span id="history-detail-status" class="text-xs text-slate-500">—</span>
      </div>
      <div id="history-detail" class="text-sm text-slate-700">Выберите заявку в списке истории.</div>
    </section>
  </main>

  <script>
    window.MOBILE_BOOTSTRAP = {
      notTechnician: false,
      username: {{ (username or '')|tojson }}
    };
  </script>
  <script src="/static/mobile-2gis.js"></script>
  <script src="/static/mobile.js"></script>
</body>
</html>
