<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lift CRM — Вход</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <main class="max-w-md mx-auto px-4 py-10">
    <div class="bg-white rounded-2xl shadow p-6 space-y-5">
      <div>
        <h1 class="text-2xl font-semibold">Вход</h1>
        <p class="text-sm text-slate-600">Введите логин и пароль для доступа к заявкам.</p>
      </div>
      {% if error %}
        <div class="rounded-xl bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
          {{ error }}
        </div>
      {% endif %}
      <form method="post" action="/login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1" for="username">Логин</label>
          <input id="username" name="username" type="text" autocomplete="username" required
            class="w-full px-4 py-3 text-base rounded-xl ring-1 ring-slate-200 bg-slate-50" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" for="password">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required
            class="w-full px-4 py-3 text-base rounded-xl ring-1 ring-slate-200 bg-slate-50" />
        </div>
        <input type="hidden" name="next" value="{{ next_url }}" />
        <button type="submit" class="w-full px-4 py-3 rounded-xl bg-slate-900 text-white text-base font-semibold">
          Войти
        </button>
      </form>
      <p class="text-xs text-slate-500">Если у вас нет доступа, обратитесь к администратору.</p>
    </div>
  </main>
</body>
</html>
