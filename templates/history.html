<!doctype html>
<html lang="ru">
<head>
  <link rel="icon" href="/static/icons/icon-192.png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>История заявок — PremierLift CRM</title>
  <link rel="stylesheet" href="/static/vendor/tailwind.css"><link rel="stylesheet" href="/static/crm.css">
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h1 class="text-2xl font-bold">История заявок</h1>
        <p class="text-sm text-slate-600">Завершённые и отменённые заявки с фильтром по дате закрытия.</p>
      </div>
      <a href="/admin?tab=ops" class="text-sm text-slate-600 underline">Назад в контроль этапов</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-4">
    <div class="bg-white rounded-2xl shadow p-4 space-y-3">
      <form id="history-filters" class="flex flex-wrap gap-3 items-end">
        <div class="flex flex-col gap-1">
          <label class="text-xs text-slate-500">с</label>
          <input id="history-from" name="date_from" type="date" class="px-3 py-2 rounded-xl ring-1 ring-slate-200 bg-slate-50 text-sm">
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs text-slate-500">по</label>
          <input id="history-to" name="date_to" type="date" class="px-3 py-2 rounded-xl ring-1 ring-slate-200 bg-slate-50 text-sm">
        </div>
        <div class="flex items-center gap-2">
          <button class="px-3 py-2 rounded-xl bg-slate-900 text-white text-sm font-semibold" type="submit">Применить</button>
          <button id="history-reset" class="px-3 py-2 rounded-xl bg-slate-100 ring-1 ring-slate-200 text-sm" type="button">Сбросить</button>
        </div>
      </form>
      <div id="history-status-filter" class="text-xs text-slate-500"></div>
    </div>

    <div class="space-y-2">
      <div id="history-state" class="text-sm text-slate-500"></div>
      <div id="history-items" class="space-y-3"></div>
    </div>
  </main>

  <script>
    const STATUS_RU = {{ STATUS_RU | tojson }};
  </script>
  <script src="/static/history.js"></script>
</body>
</html>
